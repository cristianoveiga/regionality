# defaults for all clusters
defaults:
  tasks:
    pre-task-git-url: "https://github.com/jmelis/regionality.git"
    pre-task-path: "providers/aws/pipeline-tasks/pre.yaml"
    pre-task-revision: "prerender-configmaps"
    provision-task-git-url: "https://github.com/jmelis/regionality.git"
    provision-task-path: "providers/aws/pipeline-tasks/provision.yaml"
    provision-task-revision: "prerender-configmaps"
    post-task-git-url: "https://github.com/jmelis/regionality.git"
    post-task-path: "providers/aws/pipeline-tasks/post.yaml"
    post-task-revision: "prerender-configmaps"
  data:
    PROVISION_REPO: "https://github.com/jmelis/regionality.git"
    PROVISION_REVISION: "prerender-configmaps"
    PROVISION_APPLICATION_PATH: "providers/aws/provision-application"
    PROVISION_PATH: "providers/aws/provision"
    WORKER_MACHINE_TYPE: "m5.xlarge"

# defaults per sector
sectors:
- name: canary
  tasks: {}
  data:
    KUBERNETES_VERSION: "1.33"
    WORKER_MACHINE_TYPE: "t4g.medium"
    WORKER_MACHINE_COUNT: "1"
    ACM_VERSION: "2.14"
- name: prod-01
  tasks: {}
  data:
    KUBERNETES_VERSION: "1.29"
    WORKER_MACHINE_COUNT: "2"
    ACM_VERSION: "2.14"
- name: prod-02
  tasks: {}
  data:
    KUBERNETES_VERSION: "1.29"
    WORKER_MACHINE_COUNT: "6"
    ACM_VERSION: "2.13"

# defaults per region and mapping to sector
regions:
- name: us-east-1
  sector: canary
  tasks: {}
  data:
    REGION: "us-east-1"
    TESTVAL: "regval"
- name: us-east-2
  sector: prod-01
  tasks: {}
  data:
    REGION: "us-east-2"

# clusters with their data
clusters:
- name: cluster-cveiga-01
  region: us-east-1
  tasks:
    pre-task-git-url: "https://github.com/cristianoveiga/regionality.git"
    provision-task-git-url: "https://github.com/cristianoveiga/regionality.git"
    post-task-git-url: "https://github.com/cristianoveiga/regionality.git"
  data:
    ROLE_ARN: "arn:aws:iam::100000000001:role/central-control-plane"
    PROVISION_REPO: "https://github.com/cristianoveiga/regionality.git"
- name: cluster-cveiga-02
  region: us-east-2
  tasks:
    pre-task-git-url: "https://github.com/cristianoveiga/regionality.git"
    provision-task-git-url: "https://github.com/cristianoveiga/regionality.git"
    post-task-git-url: "https://github.com/cristianoveiga/regionality.git"
  data:
    ROLE_ARN: "arn:aws:iam::100000000002:role/central-control-plane"
    PROVISION_REPO: "https://github.com/cristianoveiga/regionality.git"
